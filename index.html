
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lyria Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
        }
        body :is(img, svg, video, canvas, audio, iframe, embed, object) {
            vertical-align: baseline;
        }
        .music-gradient {
            background: linear-gradient(90deg, #c1ff72 0%, #000000 16%, #c1ff72 48%, #000000 83%, #c1ff72 100%);
        }
        input:focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: 0 0 0 2px rgba(193, 255, 114, 0.35);
        }
        textarea:not(.prompt-inner-textarea):focus {
            outline: none;
            border-color: #ffffff;
            box-shadow: inset 0 0 0 1px #ffffff, 0 0 0 3px rgba(255, 255, 255, 0.2), 0 0 24px rgba(193, 255, 114, 0.45);
        }
        .prompt-inner-textarea:focus {
            outline: none;
            box-shadow: none;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #aaa;
        }
    </style>
<script type="importmap">

  }
}
